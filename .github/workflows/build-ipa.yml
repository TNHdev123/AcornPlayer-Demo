name: Build IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: xcode-select -p

    - name: Build and Package IPA
      run: |
        mkdir -p build/Payload
        
        # 1. 使用 xcodebuild 針對 iOS 裝置（arm64）進行專案編譯
        xcodebuild build \
          -scheme AcornPlayerDemo \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          -derivedDataPath build/DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

        # 2. 尋找編譯出來的標準 .app 包並複製到 Payload
        APP_PATH=$(find build/DerivedData -name "AcornPlayerDemo.app" -type d | head -n 1)
        cp -R "$APP_PATH" build/Payload/
        
        # 3. 打包成 IPA
        cd build
        zip -r AcornPlayerDemo.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AcornPlayer-demo-ipa
        path: build/AcornPlayerDemo.ipa
