name: Build IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Swift / Xcode
      run: xcode-select -p

    - name: Build and Package IPA
      run: |
        mkdir -p build/Payload
        
        # 指定 iOS SDK 進行編譯
        swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) --triple arm64-apple-ios15.0
        
        # 建立 Payload 結構
        mkdir -p build/Payload/AcornPlayerDemo.app
        
        # 複製執行檔與 Info.plist
        if [ -d ".build/arm64-apple-ios15.0/release" ]; then
          cp .build/arm64-apple-ios15.0/release/AcornPlayerDemo build/Payload/AcornPlayerDemo.app/
        fi
        
        if [ -f "AcornPlayerDemo/Info.plist" ]; then
          cp AcornPlayerDemo/Info.plist build/Payload/AcornPlayerDemo.app/
        fi
        
        cd build
        zip -r AcornPlayerDemo.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AcornPlayer-demo-ipa
        path: build/AcornPlayerDemo.ipa
