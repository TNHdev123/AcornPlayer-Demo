name: Build IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Swift / Xcode
      run: xcode-select -p

    - name: Build and Package IPA
      run: |
        mkdir -p build/Payload/AcornPlayerDemo.app
        
        # 指定 iOS SDK 進行 Release 編譯
        swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) --triple arm64-apple-ios15.0
        
        # 尋找並複製編譯好的 Main Binary
        BINARY_PATH=$(find .build -name "AcornPlayerDemo" -type f | head -n 1)
        cp "$BINARY_PATH" build/Payload/AcornPlayerDemo.app/AcornPlayerDemo
        
        # 賦予執行檔可執行權限
        chmod +x build/Payload/AcornPlayerDemo.app/AcornPlayerDemo
        
        # 複製 Info.plist
        if [ -f "AcornPlayerDemo/Info.plist" ]; then
          cp AcornPlayerDemo/Info.plist build/Payload/AcornPlayerDemo.app/
        fi
        
        # 打包為 IPA
        cd build
        zip -r AcornPlayerDemo.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AcornPlayer-demo-ipa
        path: build/AcornPlayerDemo.ipa
