name: Build IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Swift / Xcode
      run: xcodeselect -p

    - name: Build and Package IPA
      run: |
        mkdir -p build/Payload
        
        # 使用 xcodebuild 或 swift build 自動編譯
        swift build -c release --triple arm64-apple-ios15.0-simulator
        
        # 建立 basic Payload 結構
        mkdir -p build/Payload/AcornPlayerDemo.app
        
        if [ -d ".build/arm64-apple-macosx/release/AcornPlayerDemo" ]; then
          cp .build/arm64-apple-macosx/release/AcornPlayerDemo build/Payload/AcornPlayerDemo.app/
        fi
        
        # 複製 Info.plist 如果存在
        if [ -f "AcornPlayerDemo/Info.plist" ]; then
          cp AcornPlayerDemo/Info.plist build/Payload/AcornPlayerDemo.app/
        fi
        
        cd build
        zip -r AcornPlayerDemo.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AcornPlayer-demo-ipa
        path: build/AcornPlayerDemo.ipa
